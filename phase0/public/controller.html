<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, user-scalable=no, viewport-fit=cover" />
<title>Project Tilt — Controller (Phase 0)</title>
<style>
  html, body { margin: 0; height: 100%; background: #0b0d12; color: #eee; font-family: system-ui, sans-serif;
    overflow: hidden; touch-action: none; -webkit-user-select: none; user-select: none; }
  #screen { position: absolute; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; text-align: center; padding: 24px; box-sizing: border-box; }
  h1 { font-size: 18px; color: #9fb3ff; margin-bottom: 8px; }
  p { color: #9aa4b2; font-size: 14px; max-width: 320px; line-height: 1.5; }
  button { margin-top: 20px; font-size: 18px; padding: 16px 28px; border-radius: 12px; border: none;
    background: #6ea8fe; color: #0b0d12; font-weight: 700; }
  button:active { background: #5590e0; }
  #rotate-overlay { position: absolute; inset: 0; background: #0b0d12; display: none; align-items: center; justify-content: center; z-index: 30; font-size: 16px; padding: 24px; text-align: center; }
  #wheel-view { position: absolute; inset: 0; display: none; }
  #angle-readout { position: absolute; top: 10px; left: 0; right: 0; text-align: center; font-size: 13px; color: #9aa4b2; font-variant-numeric: tabular-nums; }
  #center-btn { position: absolute; bottom: 90px; left: 50%; transform: translateX(-50%); font-size: 13px; padding: 10px 18px; }
  #pedals { position: absolute; bottom: 0; left: 0; right: 0; display: flex; height: 30%; }
  .pedal { flex: 1; display: flex; align-items: center; justify-content: center; font-size: 22px; font-weight: 700; opacity: 0.85; }
  #brake { background: #4a1f22; color: #ff8a8a; }
  #gas { background: #1f3a24; color: #8affa0; }
  .pedal.active { opacity: 1; filter: brightness(1.3); }
  #conn-badge { position: absolute; top: 10px; right: 10px; font-size: 11px; padding: 4px 8px; border-radius: 6px; background: #222633; color: #9aa4b2; }
</style>
</head>
<body>
  <div id="screen">
    <h1>PROJECT TILT</h1>
    <p>Tap to start your engine. This also asks for motion access, needed to use your phone as a wheel.</p>
    <button id="start-btn">Tap to start engine</button>
  </div>

  <div id="rotate-overlay">Rotate your phone to landscape to play.</div>

  <div id="wheel-view">
    <div id="conn-badge">connecting…</div>
    <div id="angle-readout">0°</div>
    <button id="center-btn">Re-center wheel</button>
    <div id="pedals">
      <div id="brake" class="pedal">BRAKE</div>
      <div id="gas" class="pedal">GAS</div>
    </div>
  </div>

  <script src="shared/protocol.js"></script>
  <script>
    const P = TiltProtocol;
    const startScreen = document.getElementById("screen");
    const wheelView = document.getElementById("wheel-view");
    const rotateOverlay = document.getElementById("rotate-overlay");
    const angleReadout = document.getElementById("angle-readout");
    const connBadge = document.getElementById("conn-badge");

    let angle = 0;      // fused steering angle, degrees, relative to center
    let center = 0;      // raw gravity angle (degrees) that maps to "wheel straight"
    let lastRawGravityDeg = 0;
    let last = performance.now();
    let seq = 0;
    let buttons = 0;
    let hasMotion = false;

    function onMotion(e) {
      hasMotion = true;
      const now = performance.now();
      const dt = Math.min(0.1, (now - last) / 1000);
      last = now;
      const g = e.accelerationIncludingGravity || {};
      lastRawGravityDeg = (Math.atan2(g.y || 0, g.x || 0) * 180) / Math.PI;
      const rotAlpha = e.rotationRate ? e.rotationRate.alpha : 0;
      angle = P.fuseAngle(angle, rotAlpha, dt, g, center);
      angleReadout.textContent = `${angle.toFixed(0)}°`;
    }

    function recenter() {
      center = lastRawGravityDeg; // whatever orientation the phone is held at now becomes "straight"
      angle = 0;
    }
    document.getElementById("center-btn").addEventListener("click", recenter);

    // --- pedals (buttons bitmask) ---
    function bindPedal(el, flag) {
      const set = (v) => (v ? (buttons |= flag) : (buttons &= ~flag));
      el.addEventListener("touchstart", (ev) => { ev.preventDefault(); set(true); el.classList.add("active"); }, { passive: false });
      el.addEventListener("touchend", (ev) => { ev.preventDefault(); set(false); el.classList.remove("active"); }, { passive: false });
    }
    bindPedal(document.getElementById("gas"), P.BUTTONS.GAS);
    bindPedal(document.getElementById("brake"), P.BUTTONS.BRAKE);

    // --- orientation gate (Android landscape via fullscreen; iOS shows rotate overlay) ---
    function checkOrientation() {
      const isPortrait = window.innerHeight > window.innerWidth;
      rotateOverlay.style.display = isPortrait ? "flex" : "none";
    }
    window.addEventListener("resize", checkOrientation);

    // --- wake lock ---
    let wakeLock = null;
    async function requestWakeLock() {
      try {
        if ("wakeLock" in navigator) wakeLock = await navigator.wakeLock.request("screen");
      } catch (e) { /* not fatal for the spike */ }
    }
    document.addEventListener("visibilitychange", () => {
      if (document.visibilityState === "visible" && wheelView.style.display !== "none") requestWakeLock();
    });

    // --- websocket ---
    let ws;
    function connect() {
      ws = new WebSocket(`ws://${location.host}`);
      ws.addEventListener("open", () => {
        ws.send(JSON.stringify({ type: "hello", role: "controller" }));
        connBadge.textContent = "connected";
      });
      ws.addEventListener("close", () => {
        connBadge.textContent = "reconnecting…";
        setTimeout(connect, 1000);
      });
      ws.addEventListener("message", (ev) => {
        const msg = JSON.parse(ev.data);
        if (msg.type === "host-ready") connBadge.textContent = "connected";
      });
    }

    // --- send loop, ~60Hz ---
    function sendLoop() {
      if (ws && ws.readyState === ws.OPEN) {
        const shaped = P.shape(angle / P.MAX_ANGLE);
        const packet = P.encodeInput(seq++, shaped, buttons);
        packet.type = "input";
        ws.send(JSON.stringify(packet));
      }
      setTimeout(sendLoop, 1000 / 60);
    }

    // --- start flow ---
    document.getElementById("start-btn").addEventListener("click", async () => {
      // iOS requires this permission request to originate from a user gesture.
      if (typeof DeviceMotionEvent !== "undefined" && typeof DeviceMotionEvent.requestPermission === "function") {
        try {
          const result = await DeviceMotionEvent.requestPermission();
          if (result !== "granted") {
            alert("Motion permission denied — steering needs it. Reload to try again.");
            return;
          }
        } catch (e) {
          alert("Could not request motion permission: " + e.message);
          return;
        }
      }
      window.addEventListener("devicemotion", onMotion);
      requestWakeLock();
      if (document.documentElement.requestFullscreen) {
        document.documentElement.requestFullscreen().catch(() => {});
      }
      if (screen.orientation && screen.orientation.lock) {
        screen.orientation.lock("landscape").catch(() => {});
      }
      startScreen.style.display = "none";
      wheelView.style.display = "block";
      checkOrientation();
      connect();
      sendLoop();
    });
  </script>
</body>
</html>
